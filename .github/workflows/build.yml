name: build

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to package'
        required: true
      name:
        description: 'App name'
        required: true
      bundle_id:
        description: 'Bundle id'
        required: true
        default: 'com.pake.app'
      icon:
        description: 'Icon path or URL (auto-discovered from the site if empty)'
        required: false
      version:
        description: 'App version, x.y.z (defaults to 1.0.0)'
        required: false

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      # gh release create 需要写 contents。
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      # CI runner 每次是新环境，必然冷构建。缓存能缓解，
      # 但云构建始终慢于本地——这是物理限制，不是设计缺陷。
      #
      # 拆成 restore / save 两步而不是一个 cache 步骤：`save-always`
      # 已被 GitHub 标记为 deprecated 且「does not work as intended」。
      # 独立 save + `if: always()` 是推荐替代方案——job 即使失败也会
      # 保留已下载的 Gradle 依赖，下次运行仍是热构建。
      #
      # 用 `restore-keys` 做前缀匹配回退：每次存储用唯一 key（包含
      # run_id），但恢复时匹配任意一次历史运行——GitHub cache 是
      # immutable 的，正好利用这个属性实现「只存不覆盖、恢复取最新」。
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/pake_shell/android/**/*.gradle*') }}-${{ github.run_id }}
          restore-keys: gradle-${{ runner.os }}-${{ hashFiles('packages/pake_shell/android/**/*.gradle*') }}-


      # 不走 `dart pub global activate`：它生成的壳脚本会把
      # "Resolving dependencies…" 打到 stdout，混在 `--json` 输出前面，
      # 下游 jq/agent 直接解析失败。`dart run` 从包目录跑，依赖已解析，
      # stdout 只有 JSON 对象本身。
      - name: Install CLI dependencies
        working-directory: packages/pake_cli
        run: dart pub get

      # 密钥写到 `~/.pake/signing.properties`——和本地构建同一个约定，
      # `pake_shell/android/app/build.gradle.kts` 只认这一个位置。
      #
      # 不配 secrets 时这步什么都不写，构建照样出包，但会回落到 debug 签名。
      # 那种包每次运行的签名指纹都不同，装不上也升不了级，所以下面的
      # Report signing 会把实际签名类型摆到 job summary 上，不让它蒙混过去。
      #
      # 条件判断放在 shell 里而不是 `if:`——step 级 `env` 对同一步的 `if:`
      # 并不可见，写成 `if: env.X != ''` 会恒为真。
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to a debug key."
            exit 0
          fi
          mkdir -p "$HOME/.pake"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.pake/release.p12"
          cat > "$HOME/.pake/signing.properties" <<EOF
          storeFile=$HOME/.pake/release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build
        working-directory: packages/pake_cli
        # runner 默认是 `bash -e`，不开 pipefail：不加这句，pakem 失败也会被
        # tee 的退出码盖住，job 绿着结束而 build.json 里是半截输出。
        run: |
          set -o pipefail
          # 两个可选输入展开成空时整段省掉，不能传 `--icon ""` / `--version ""`：
          # 空 version 会被 validateConfig 判成非法版本号，空 icon 会让图标
          # 自动发现这条路走不到。留空 = 交给 CLI 的默认行为。
          ICON="${{ inputs.icon }}"
          VERSION="${{ inputs.version }}"
          dart run bin/pakem.dart build "${{ inputs.url }}" \
            --name "${{ inputs.name }}" \
            --bundle-id "${{ inputs.bundle_id }}" \
            ${ICON:+--icon "$ICON"} \
            ${VERSION:+--version "$VERSION"} \
            --platform android \
            --json | tee "$GITHUB_WORKSPACE/build.json"
          echo

      - name: Report signing
        run: |
          MODE=$(jq -r '.androidSigning // "unknown"' build.json)
          echo "Android signing: **$MODE**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" != release ]; then
            echo "::warning::APK signed with a throwaway debug key — it cannot be installed over, or upgraded from, any other build. Set the ANDROID_KEYSTORE_* secrets for a distributable APK."
          fi

      # upload-artifact 的 glob 不展开 `~`，会把它当成字面目录名，于是什么
      # 都匹配不到；再加上 `if-no-files-found` 默认只是 warn，job 就绿着结束
      # 而一个文件都没上传。先在 shell 里（`$HOME` 会展开）把归档产物收拢到
      # github.workspace 下，再用相对路径上传。
      - name: Collect archived artifacts
        run: |
          mkdir -p artifacts
          cp "$HOME"/.pake/out/*/app-*.apk artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/
          # 这条比路径修复更要紧：它让「上传了个空气」这类失败再也藏不住。
          if-no-files-found: error

      # Artifact 90 天过期——Release 永久保留且对用户可见。
      # 用 app 名 + 时间戳做 tag，既不撞也不覆盖已有 Release。
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(jq -r '.app' build.json)
          SIGNING=$(jq -r '.androidSigning // "unknown"' build.json)
          # 用户没填 version 时这里读到的是 CLI 的默认值，不是空——
          # 版本从构建结果里读，不在 workflow 里重复一遍默认值等它腐化。
          VERSION=$(jq -r '.version // "unknown"' build.json)
          # 图标回落在 --json 下是完全静默的：拿到包发现是默认图标时，得能
          # 分清是站点没图标、下载失败、还是抓到的根本不是图片。
          ICON_SOURCE=$(jq -r '.icon // "unknown"' build.json)
          TAG="$(echo "$APP" | tr 'A-Z ' 'a-z-')-$(date +%Y%m%d-%H%M%S)"
          WARNING=""
          if [ "$SIGNING" != release ]; then
            WARNING='⚠️ Signed with a throwaway debug key — this APK cannot be installed over any other build.'
          fi
          case "$ICON_SOURCE" in
            default)
              ICON_LINE='**Icon:** default (generating one from the app name also failed)' ;;
            generated)
              ICON_LINE='**Icon:** generated from the app name (the site offered nothing usable)' ;;
            *)
              ICON_LINE="**Icon:** $ICON_SOURCE" ;;
          esac
          gh release create "$TAG" \
            artifacts/app-*.apk \
            --title "$APP $VERSION" \
            --notes "## $APP $VERSION

          **URL:** ${{ inputs.url }}
          **Bundle ID:** ${{ inputs.bundle_id }}
          **Version:** $VERSION
          $ICON_LINE
          **Signing:** $SIGNING

          $WARNING

          ---
          Built from [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"

      # restore 在上面（Build 之前），save 在这里（Build 之后）。
      # `if: always()` 确保即使 Build / Report / Collect 任何一步失败，
      # Gradle 缓存也会保留——下次运行不需从头下载 1.2GB 依赖。
      #
      # key 含 `run_id` 所以每次都是唯一的，不会因为 immutable 冲突
      # 导致 save 失败。下次运行的 restore-keys 前缀匹配捡起这份缓存。
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/pake_shell/android/**/*.gradle*') }}-${{ github.run_id }}

  smoke:
    # 不再自己做一次完整 Android 构建——直接验证 android job 的产物。
    # 之前 smoke 独立跑 `pakem build example.com`，和 android job 各做
    # 一次冷 Gradle，浪费一倍的 CI 分钟而没有任何额外信号。
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: artifacts/

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(ls artifacts/app-arm64-v8a-release.apk 2>/dev/null || true)
          if [ -z "$APK" ]; then
            echo "::error::No arm64 APK found in artifact"
            exit 1
          fi

          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          # 直接从 zip 里把 JSON 拽出来——不需要 aapt。
          CONFIG=$(unzip -p "$APK" assets/flutter_assets/assets/pake.json)
          echo "pake.json: $CONFIG"

          URL=$(echo "$CONFIG" | jq -r '.url')
          NAME=$(echo "$CONFIG" | jq -r '.name')
          BUNDLE=$(echo "$CONFIG" | jq -r '.bundleId')

          if [ "$URL" != "${{ inputs.url }}" ]; then
            echo "::error::URL mismatch: expected '${{ inputs.url }}', got '$URL'"
            exit 1
          fi
          if [ "$NAME" != "${{ inputs.name }}" ]; then
            echo "::error::Name mismatch: expected '${{ inputs.name }}', got '$NAME'"
            exit 1
          fi
          if [ "$BUNDLE" != "${{ inputs.bundle_id }}" ]; then
            echo "::error::Bundle ID mismatch: expected '${{ inputs.bundle_id }}', got '$BUNDLE'"
            exit 1
          fi

          echo "All verifications passed."
