name: build

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to package'
        required: true
      name:
        description: 'App name'
        required: true
      bundle_id:
        description: 'Bundle id'
        required: true
        default: 'com.pake.app'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      # CI runner 每次是新环境，必然冷构建。缓存能缓解，
      # 但云构建始终慢于本地——这是物理限制，不是设计缺陷。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/pake_shell/android/**/*.gradle*') }}

      - name: Install pakem
        run: dart pub global activate --source path packages/pake_cli

      # 密钥写到 `~/.pake/signing.properties`——和本地构建同一个约定，
      # `pake_shell/android/app/build.gradle.kts` 只认这一个位置。
      #
      # 不配 secrets 时这步整个跳过，构建照样出包，但会回落到 debug 签名。
      # 那种包每次运行的签名指纹都不同，装不上也升不了级，所以下面的
      # Report signing 会把实际签名类型摆到 job summary 上，不让它蒙混过去。
      #
      # 条件判断放在 shell 里而不是 `if:`——step 级 `env` 对同一步的 `if:`
      # 并不可见，写成 `if: env.X != ''` 会恒为真。
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to a debug key."
            exit 0
          fi
          mkdir -p "$HOME/.pake"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.pake/release.p12"
          cat > "$HOME/.pake/signing.properties" <<EOF
          storeFile=$HOME/.pake/release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build
        # runner 默认是 `bash -e`，不开 pipefail：不加这句，pakem 失败也会被
        # tee 的退出码盖住，job 绿着结束而 build.json 里是半截输出。
        run: |
          set -o pipefail
          pakem build "${{ inputs.url }}" \
            --name "${{ inputs.name }}" \
            --bundle-id "${{ inputs.bundle_id }}" \
            --platform android \
            --json | tee build.json
          echo

      - name: Report signing
        run: |
          MODE=$(jq -r '.androidSigning // "unknown"' build.json)
          echo "Android signing: **$MODE**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" != release ]; then
            echo "::warning::APK signed with a throwaway debug key — it cannot be installed over, or upgraded from, any other build. Set the ANDROID_KEYSTORE_* secrets for a distributable APK."
          fi

      # upload-artifact 的 glob 不展开 `~`，会把它当成字面目录名，于是什么
      # 都匹配不到；再加上 `if-no-files-found` 默认只是 warn，job 就绿着结束
      # 而一个文件都没上传。先在 shell 里（`$HOME` 会展开）把归档产物收拢到
      # github.workspace 下，再用相对路径上传。
      - name: Collect archived artifacts
        run: |
          mkdir -p artifacts
          cp -R "$HOME"/.pake/out/*/. artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/
          # 这条比路径修复更要紧：它让「上传了个空气」这类失败再也藏不住。
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true
      - name: Smoke build
        working-directory: packages/pake_cli
        # `--tags smoke` 只是选中被打了 smoke 标签的用例；
        # `dart_test.yaml` 里的 `skip:` 是无条件的，不会因为
        # `--tags` 选中了它就不跳过。必须再加 `--run-skipped`
        # 才会真正执行——这是本任务实测出来的，不是查文档猜的：
        # 光用 `dart test --tags smoke` 在本地会得到
        # "All tests skipped."，退出码 0，CI 会静默地什么都没测。
        run: dart pub get && dart test --tags smoke --run-skipped
