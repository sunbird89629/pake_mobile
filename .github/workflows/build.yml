name: build

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to package'
        required: true
      name:
        description: 'App name'
        required: true
      bundle_id:
        description: 'Bundle id'
        required: true
        default: 'com.pake.app'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true

      # CI runner 每次是新环境，必然冷构建。缓存能缓解，
      # 但云构建始终慢于本地——这是物理限制，不是设计缺陷。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/pake_shell/android/**/*.gradle*') }}

      - name: Install pakem
        run: dart pub global activate --source path packages/pake_cli

      - name: Build
        run: |
          pakem build "${{ inputs.url }}" \
            --name "${{ inputs.name }}" \
            --bundle-id "${{ inputs.bundle_id }}" \
            --platform android \
            --json

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ~/.pake/workspace/build/app/outputs/flutter-apk/*.apk

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          cache: true
      - name: Smoke build
        working-directory: packages/pake_cli
        # `--tags smoke` 只是选中被打了 smoke 标签的用例；
        # `dart_test.yaml` 里的 `skip:` 是无条件的，不会因为
        # `--tags` 选中了它就不跳过。必须再加 `--run-skipped`
        # 才会真正执行——这是本任务实测出来的，不是查文档猜的：
        # 光用 `dart test --tags smoke` 在本地会得到
        # "All tests skipped."，退出码 0，CI 会静默地什么都没测。
        run: dart pub get && dart test --tags smoke --run-skipped
