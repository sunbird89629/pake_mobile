name: pake_cli
description: pakem — build any web page into an Android APK or iOS IPA.
# 占位，暂不维护：只能 `dart pub global activate --source path` 从本地装，
# 没有分发渠道，没人能选装哪一版——编号是空仪式。有了分发渠道再启用，
# 规则和启用判据见 docs/versioning.md。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

executables:
  pakem: pakem

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  http: ^1.2.0
  html: ^0.15.0
  image: ^4.2.0
  pake_config:
    path: ../pake_config

dev_dependencies:
  test: ^1.25.0
